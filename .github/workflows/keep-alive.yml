name: Supabase Keep Alive

on:
  schedule:
    # 3일마다 한 번씩 실행 (UTC 기준 0시 0분)
    - cron: '0 0 */3 * *'
  workflow_dispatch: # GitHub UI에서 수동으로 실행 가능

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Keep Alive API
        run: |
          # Vercel 배포 도메인을 여기에 적절히 반영해야 합니다.
          # 현재 프로젝트의 Vercel URL을 사용하거나 환경 변수에서 가져올 수 있습니다.
          curl -X GET "https://nextjs-supabase-examples-ten.vercel.app/api/keep-alive" \
               -H "x-keep-alive-key: ${{ secrets.KEEP_ALIVE_SECRET_KEY }}"
