name: Supabase Keep Alive

on:
  schedule:
    # 3일마다 1회 실행 (UTC 기준 0시 0분 / KST 오전 9시)
    - cron: '0 0 */3 * *'
  workflow_dispatch: # GitHub 웹 UI에서 수동으로 'Run workflow' 즉시 실행 가능

jobs:
  ping:
    name: Keep Supabase Awake
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase PostgreSQL Directly
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://dvzuibrnjxanuiqqqbjl.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR2enVpYnJuanhhbnVpcXFxYmpsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkyNzk1MjAsImV4cCI6MjA5NDg1NTUyMH0.o78KYMyw7RX72FmanQGZAjmxK01LUuI3bXx26WzLaa4' }}
        run: |
          echo "Sending keep-alive query directly to Supabase REST API..."
          RESPONSE=$(curl -f -s -S -X GET "${SUPABASE_URL}/rest/v1/posts?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          
          echo "Supabase responded successfully!"
          echo "Payload: ${RESPONSE}"
